_custom_imports_:
- HybridSNN.network
- HybridSNN.dataset
- HybridSNN.runner

data:
  type: SHDDataset
  file: shd_train.h5
  test_file: shd_test.h5
  num_time_bins: 100
  num_neurons: 700
  train_ratio: 0.9        # train+valid split of shd_train.h5 (no test held out)
  test_ratio: 0.0
  adaptive_binning: true
  spike_count: true
  time_jitter_bins: 2
  time_scale_range: 0.0
  time_mask_ratio: 0.03
  neuron_dropout: 0.02
  spike_noise_rate: 0.0005

network:
  type: HybridSNN
  dim: 128
  d_ff: 256
  heads: 8
  depths: 2
  num_steps: 12
  encoder_type: delta_conv
  neuron_type: tslif
  spike_lambda: 0.02
  spike_target: 0.2
  spike_loss_mode: target
  branch_balance_lambda: 0.02
  fusion_balance_lambda: 0.01
  merged_fusion_hidden: 128
  channel_mixer_type: none
  encoder_dropout: 0.2
  analog_delta_residual: true
  analog_delta_residual_weight: 0.1
  analog_delta_residual_dropout: 0.05
  threshold: 0.7
  current_gain_init: 1.1
  input_bias_init: 0.05
  delta_scale_init: 5.0
  delta_bias_init: 0.1
  surrogate_type: atan
  surrogate_alpha: 2.0
  surrogate_alpha_min: 0.5
  surrogate_alpha_max: 10.0
  spike_warmup_epochs: 10

runner:
  type: hybrid_ts
  task: multiclassification
  optimizer: Adam
  lr: 0.0001
  weight_decay: 1e-5
  loss_fn: cross_entropy_smooth
  metrics: [accuracy]
  observe: loss
  lower_is_better: True
  max_epoches: 200
  early_stop: 30
  batch_size: 64
  out_size: 20
  aggregate: False
  readout_mode: attention_pool
  readout_hidden: 256
  readout_dropout: 0.1
  viz_every: 5
  spike_lambda: 0.02
  num_workers: 0
  persistent_workers: falsec
  grad_clip: 1.0
  scheduler_type: warmup_cosine
  warmup_epochs: 8
  min_lr_ratio: 0.1
  ema_decay: 0.999
  ema_eval: true
  wandb_enabled: true
  wandb_project: HybridSNN
  wandb_run_name: shd_hybrid

runtime:
  seed: 42
  output_dir: runs/hybrid_snn_run_shd
