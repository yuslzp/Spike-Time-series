_custom_imports_:
- HybridSNN.network
- HybridSNN.dataset
- HybridSNN.runner

data:
  type: SHDDataset
  file: shd_train.h5
  num_time_bins: 100
  num_neurons: 700
  train_ratio: 0.8
  test_ratio: 0.1
  time_jitter_bins: 2
  time_scale_range: 0.0
  time_mask_ratio: 0.03
  neuron_dropout: 0.02
  spike_noise_rate: 0.0005

network:
  type: HybridSNN
  dim: 128
  d_ff: 256
  heads: 8
  depths: 2
  num_steps: 12
  encoder_type: delta_conv
  neuron_type: tslif
  spike_lambda: 0.02
  spike_target: 0.2
  spike_loss_mode: target
  encoder_dropout: 0.2
  analog_delta_residual: true
  analog_delta_residual_weight: 0.1
  analog_delta_residual_dropout: 0.05
  threshold: 0.7
  current_gain_init: 1.1
  input_bias_init: 0.05
  delta_scale_init: 5.0
  delta_bias_init: 0.1
  spike_warmup_epochs: 10

runner:
  type: hybrid_ts
  task: multiclassification
  optimizer: Adam
  lr: 0.0001
  weight_decay: 1e-5
  loss_fn: cross_entropy_smooth
  metrics: [accuracy]
  observe: loss
  lower_is_better: True
  max_epoches: 200
  early_stop: 20
  batch_size: 64
  out_size: 20
  aggregate: True
  viz_every: 5
  spike_lambda: 0.02
  num_workers: 0
  persistent_workers: false
  grad_clip: 1.0

runtime:
  seed: 42
  output_dir: outputs/hybrid_snn_shd_classification
