network:
  type: HybridSNN
  dim: 128
  d_ff: 256
  heads: 8
  depths: 2
  num_steps: 8
  encoder_type: merged
  neuron_type: tslif
  spike_lambda: 0.02
  spike_target: 0.25
  spike_loss_mode: target
  branch_balance_lambda: 0.02
  fusion_balance_lambda: 0.01
  merged_fusion_hidden: 128
  channel_mixer_type: causal_low_rank
  channel_mixer_rank: 16
  channel_mixer_kernel_size: 3
  channel_mixer_dropout: 0.0
  channel_mixer_residual_gate: true
  subsample_rate: 4
  kernel_size: 5
  encoder_dropout: 0.0
  analog_delta_residual: true
  analog_delta_residual_weight: 0.15
  analog_delta_residual_dropout: 0.05
  init_input_dropout: 0.05
  delta_spike_target: 0.05
  conv_spike_target: 0.03
  delta_spike_lambda: 0.08
  conv_spike_lambda: 0.05
  threshold: 0.7
  current_gain_init: 1.2
  input_bias_init: 0.08
  delta_scale_init: 5.0
  delta_bias_init: 0.1
  surrogate_type: atan
  surrogate_alpha: 2.0
  surrogate_alpha_min: 0.5
  surrogate_alpha_max: 10.0
  spike_warmup_epochs: 10
