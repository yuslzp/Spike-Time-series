_base_:
- ../model/hybrid_snn.yml
- ../dataset/metr-la.yml
_custom_imports_:
- HybridSNN.network
- HybridSNN.dataset
- HybridSNN.runner

data:
  window: 168
  horizon: 12
  train_ratio: 0.7
  test_ratio: 0.1

network:
  dim: 32
  d_ff: 64
  heads: 4
  depths: 1
  num_steps: 4
  encoder_type: merged
  spike_lambda: 0.01
  spike_target: 0.2
  spike_loss_mode: target
  threshold: 0.7
  current_gain_init: 1.1
  input_bias_init: 0.05

runner:
  type: hybrid_ts
  task: regression
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0
  loss_fn: huber
  metrics: [r2, rrse]
  observe: loss
  lower_is_better: True
  max_epoches: 2
  early_stop: 5
  batch_size: 8
  aggregate: False
  mlp_head: True
  readout_mode: horizon_decoder
  readout_hidden: 128
  readout_dropout: 0.1
  decoder_num_heads: 4
  forecast_residual: true
  viz_every: 0
  spike_lambda: 0.01
  num_workers: 0
  persistent_workers: false

runtime:
  seed: 42
  output_dir: outputs/hybrid_snn_smoke_metr-la
